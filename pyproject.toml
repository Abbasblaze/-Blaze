[project]
name = "blaze"
version = "0.1.0"
description = "Blaze — an always-on AI desk partner that sees, listens, talks and helps run your laptop."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "httpx>=0.27",
    "kokoro-onnx>=0.4",
    "numpy>=1.26",
    "ollama>=0.4",
    "opencv-python-headless>=4.10",
    "psutil>=6.0",
    "pydantic>=2.8",
    "pyside6-essentials>=6.7",
    "sounddevice>=0.5",
    "webrtcvad-wheels>=2.0.14",
]

[project.scripts]
blaze = "blaze.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blaze"]
